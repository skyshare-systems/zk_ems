<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Template</title>
  </head>
  <body>
    <table
      role="presentation"
      width="100%"
      border="0"
      cellspacing="0"
      cellpadding="0"
      style="
        font-family: 'Open Sans', 'Helvetica Neue', sans-serif;
        text-align: center;
        border-collapse: collapse;
      "
    >
      <tr>
        <td align="center">
          <img
            src="https://skyshare-labs.sgp1.cdn.digitaloceanspaces.com/email_header.png"
            alt="IBA Logo"
            style="
              display: block;
              max-width: 640px;
              width: 100%;
              margin: 0 auto;
              margin-bottom: 16px;
            "
          />
        </td>
      </tr>
    </table>

    <!-- Background Image Section -->

    <table
      role="presentation"
      width="100%"
      border="0"
      cellspacing="0"
      cellpadding="0"
      style="max-width: 640px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="640"
            border="0"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 640px;
              width: 100%;
              background: url('https://skyshare-labs.sgp1.cdn.digitaloceanspaces.com/bg-1.png')
                no-repeat center center;
              background-size: cover;
              text-align: center;
            "
          >
            <tr>
              <td align="center" valign="top" style="padding: 32px">
                <table
                  role="presentation"
                  width="100%"
                  border="0"
                  cellspacing="0"
                  cellpadding="0"
                >
                  <tr>
                    <!-- Left Column -->
                    <td
                      width="50%"
                      align="left"
                      valign="top"
                      style="
                        color: white;
                        font-size: 20px;
                        font-weight: bold;
                        font-family: Arial, sans-serif;
                        padding: 12px;
                      "
                    >
                      <p
                        style="
                          margin-bottom: 12px;
                          font-size: 20px;
                          margin-top: 0;
                          font-weight: 600;
                        "
                      >
                        James Patrick Lucas
                      </p>
                      <p
                        style="
                          font-size: 14px;
                          color: #fff;
                          opacity: 0.5;
                          font-weight: 400;
                        "
                      >
                        Business Development Manager
                      </p>

                      <table
                        role="presentation"
                        cellspacing="0"
                        cellpadding="0"
                        border="0"
                        style="display: inline-block"
                      >
                        <tr>
                          <td width="24" align="center" valign="middle">
                            <img
                              src="https://skyshare-labs.sgp1.cdn.digitaloceanspaces.com/phone.png"
                              width="14"
                              height="14"
                              alt="Email Icon"
                              style="display: block"
                            />
                          </td>
                          <td
                            style="
                              font-size: 14px;
                              color: white;
                              padding-left: 8px;
                              font-family: Arial, sans-serif;
                              font-weight: 400;
                            "
                          >
                            +917 678 4455
                          </td>
                        </tr>
                      </table>

                      <table
                        role="presentation"
                        cellspacing="0"
                        cellpadding="0"
                        border="0"
                        style="display: inline-block"
                      >
                        <tr>
                          <td width="24" align="center" valign="middle">
                            <img
                              src="https://skyshare-labs.sgp1.cdn.digitaloceanspaces.com/mail.png"
                              width="20"
                              height="20"
                              alt="Email Icon"
                              style="display: block"
                            />
                          </td>
                          <td
                            style="
                              font-size: 14px;
                              color: white;
                              padding-left: 8px;
                              font-family: Arial, sans-serif;
                              font-weight: 400;
                            "
                          >
                            jameslucas@skysharelabs.com
                          </td>
                        </tr>
                      </table>
                    </td>

                    <!-- Right Column -->

                    <td
                      width="50%"
                      align="left"
                      style="
                        color: white;
                        font-size: 20px;
                        font-weight: bold;
                        font-family: Arial, sans-serif;
                        padding: 12px;
                      "
                    >
                      <p
                        style="
                          margin-bottom: 12px;
                          font-size: 20px;
                          margin-top: 0;
                        "
                      >
                        Skyshare Labs Inc.
                      </p>

                      <table
                        role="presentation"
                        cellspacing="0"
                        cellpadding="0"
                        border="0"
                        style="display: inline-block"
                      >
                        <tr>
                          <td width="24" align="center" valign="middle">
                            <img
                              src="https://skyshare-labs.sgp1.cdn.digitaloceanspaces.com/phone.png"
                              width="14"
                              height="14"
                              alt="Email Icon"
                              style="display: block"
                            />
                          </td>
                          <td
                            style="
                              font-size: 14px;
                              color: white;
                              padding-left: 8px;
                              font-family: Arial, sans-serif;
                              font-weight: 400;
                            "
                          >
                            +63 956 487 5538
                          </td>
                        </tr>
                      </table>

                      <table
                        role="presentation"
                        cellspacing="0"
                        cellpadding="0"
                        border="0"
                        style="display: inline-block"
                      >
                        <tr>
                          <td width="24" align="center" valign="middle">
                            <img
                              src="https://skyshare-labs.sgp1.cdn.digitaloceanspaces.com/mail.png"
                              width="20"
                              height="20"
                              alt="Email Icon"
                              style="display: block"
                            />
                          </td>
                          <td
                            style="
                              font-size: 14px;
                              color: white;
                              padding-left: 8px;
                              font-family: Arial, sans-serif;
                              font-weight: 400;
                            "
                          >
                            management@skysharelabs.com
                          </td>
                        </tr>
                      </table>

                      <table
                        role="presentation"
                        cellspacing="0"
                        cellpadding="0"
                        border="0"
                        style="display: inline-block"
                      >
                        <tr>
                          <td width="24" align="center" valign="top">
                            <img
                              src="https://skyshare-labs.sgp1.cdn.digitaloceanspaces.com/pin.png"
                              width="20"
                              height="20"
                              alt="Email Icon"
                              style="display: block"
                            />
                          </td>
                          <td
                            style="
                              font-size: 14px;
                              color: white;
                              padding-left: 8px;
                              font-family: Arial, sans-serif;
                              font-weight: 400;
                            "
                          >
                            Block 6, Lot 6A Dulalia Homes 1, T. Santiago St.,
                            Viente Reales, Valenzuela City
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
